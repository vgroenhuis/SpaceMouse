[env:PC_Teensy_SpaceMouse]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
extra_scripts = scripts/increment_version.py
lib_deps = 
    https://github.com/PaulStoffregen/USBHost_t36.git ; using latest version fixes an important bug
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/tonton81/WDT_T4

[platformio]
default_envs = PC_Teensy_SpaceMouse
