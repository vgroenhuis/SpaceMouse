[env:esp32c5-display]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino
board = esp32-c5-devkitc1-n16r4 ; WaveShare. Should be -n16r8 but this is not available yet.
board_build.filesystem = littlefs
board_build.partitions = partitions-16M.csv
upload_speed = 921600
monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    esp32async/ESPAsyncWebServer
    vgroenhuis/roaming-wifi-manager
    bblanchon/ArduinoJson

build_flags = 
    -D RED_GREEN_REVERSED ; WaveShare has red and green reversed compared to the Adafruit library. This flag is used to correct for that.
    -D WIFI_DEBUG_LEVEL=3
