[env:PC_Teensy_SpaceMouse]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps = 
    https://github.com/PaulStoffregen/USBHost_t36.git
    bblanchon/ArduinoJson
    https://github.com/tonton81/WDT_T4

build_flags =
    ; -D USBHOST_PRINT_DEBUG

[platformio]
default_envs = PC_Teensy_SpaceMouse
